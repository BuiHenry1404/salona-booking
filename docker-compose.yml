services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Máy reboot hoặc app crash thì tự lên lại. `unless-stopped` chứ không phải
    # `always`: đã chủ động `docker compose stop` thì đừng tự bật lại.
    restart: unless-stopped
    depends_on:
      - mongo
    volumes:
      - .:/app
      # Settings chỉ đọc file, không đọc biến môi trường — nên không có khối
      # `environment:`. Mount ra ngoài /app để máy dev không thấy file này.
      - ./.env.docker:/run/config/env.docker:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chatbot_db
    # Mặc định của Docker là 1024, quá thấp so với mức 64000 MongoDB khuyến nghị.
    # WiredTiger giữ một file cho mỗi collection và mỗi index; bộ test drop rồi
    # tạo lại index sau từng test nên chạm trần rất nhanh. Hết fd thì
    # __posix_directory_sync trả EMFILE -> WT_PANIC -> mongod abort (exit 14),
    # và mọi test sau đó fail bằng ServerSelectionTimeoutError.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000

  # CHỈ dùng ở dev: cổng 8081, user/pass admin/admin, ai vào cũng sửa được dữ
  # liệu khách. Không có `restart:` để nó không tự sống lại sau reboot. Phải bỏ
  # hẳn khỏi file compose của prod.
  mongo-express:
    image: mongo-express:1.0.0
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongo

volumes:
  mongo_data:
