<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #d8d8d8;
    --card: #f7f7f8;
    --bad: #b00020;
    --bad-bg: #fdecea;
    --worse: #b35c00;
    --mismatch-bg: #fff2cc;
    --ok: #0a7a2f;
    --link: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8e8;
      --muted: #a0a0a0;
      --border: #3a3d42;
      --card: #1e2126;
      --bad: #ff6b6b;
      --bad-bg: #3a1618;
      --worse: #ffb366;
      --mismatch-bg: #3a330f;
      --ok: #5fd37a;
      --link: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px;
    line-height: 1.45;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.2rem; }
  h2 { font-size: 1.2rem; margin-top: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  h3 { font-size: 1.0rem; margin-top: 1.4rem; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
  .warnings {
    background: var(--mismatch-bg);
    border: 1px solid var(--worse);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    margin: 1rem 0;
  }
  .warnings ul { margin: 0.3rem 0 0 1.1rem; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 0.6rem 0 1.2rem; font-size: 0.9rem; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--card); }
  tr.mismatch { background: var(--mismatch-bg); }
  .bad { color: var(--bad); font-weight: 600; }
  .worse { color: var(--worse); font-weight: 600; }
  .ok { color: var(--ok); }
  .muted { color: var(--muted); }
  .scenario-block { margin-bottom: 2rem; }
  .sim-columns { display: flex; gap: 1rem; flex-wrap: wrap; }
  .sim-col {
    flex: 1 1 280px;
    min-width: 260px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 0.8rem;
    background: var(--card);
  }
  .sim-turn { margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px dashed var(--border); }
  .sim-turn:last-child { border-bottom: none; }
  .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
  .ref-status-ready { color: var(--ok); }
  .ref-status-bad { color: var(--bad); font-weight: 600; }
  pre.err {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bad-bg);
    color: var(--bad);
    padding: 0.5rem;
    border-radius: 4px;
    font-size: 0.8rem;
    max-height: 220px;
    overflow: auto;
  }
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div class="meta">Tạo lúc {{GENERATED_AT}}</div>
{{BODY}}
</body>
</html>
